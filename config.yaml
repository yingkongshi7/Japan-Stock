# Merge this block into your real config.yaml.
# Goal: reduce email noise by sending pullback/drawdown-style alerts only.
# Breakout/new-high style alerts are still safe to log in CSV if your script logs all generated signals,
# but they should not trigger normal notification emails.

email_policy:
  daily_summary_default: true
  send_individual_alerts: true
  notify_action_levels:
    - A
    - B
  send_summary_when_no_notify_alerts: false

  # Pullback / drawdown focused notifications only.
  # Removed: breakout_but_overheated
  # Also do not add breakout_strength here.
  individual_alert_types:
    - weak_deep_pullback
    - pullback_but_overheated
    - pullback_watch
    - deep_pullback_trend_intact

  send_sector_heat_individual: false
