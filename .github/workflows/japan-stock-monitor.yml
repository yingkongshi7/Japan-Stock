name: Japan Stock Monitor

on:
  schedule:
    - cron: "17 8 * * 1-5"
    - cron: "47 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - dry-run
          - report
          - test-email
          - summary-email

concurrency:
  group: japan-stock-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="normal"
          fi

          if [ "$MODE" = "dry-run" ]; then
            python stock_monitor.py --dry-run --report
          elif [ "$MODE" = "report" ]; then
            python stock_monitor.py --report
          elif [ "$MODE" = "test-email" ]; then
            python stock_monitor.py --test-email
          elif [ "$MODE" = "summary-email" ]; then
            python stock_monitor.py --summary-email
          else
            python stock_monitor.py
          fi

      - name: Commit alert state
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'normal'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add alert_state.json stock_signal_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update stock monitor state and signal log" && git push)

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log
          path: monitor.log

      - name: Upload alert state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-state
          path: alert_state.json
          if-no-files-found: warn

      - name: Upload signal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-signal-log
          path: stock_signal_log.csv
          if-no-files-found: warn
